<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Controle LG</title>
<style>
  :root { --bg:#111; --key:#2a2a2e; --key2:#3a3a40; --txt:#f2f2f2; --red:#a50034; --ok:#2e7d32; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; padding:12px 16px 24px; }
  h1 { font-size:18px; margin:4px 0 10px; }
  #conn { display:flex; gap:8px; margin-bottom:6px; }
  #conn input { flex:1; padding:12px; border-radius:10px; border:1px solid #444; background:#1c1c20; color:var(--txt); font-size:16px; }
  button { border:0; border-radius:14px; background:var(--key); color:var(--txt); font-size:18px; padding:0; height:52px; }
  button:active { background:var(--key2); }
  #go { padding:0 16px; background:var(--red); font-weight:600; font-size:16px; }
  #status { font-size:14px; min-height:20px; margin:4px 0 10px; color:#ccc; }
  #status.ok { color:#7ddc82; } #status.err { color:#ff8a80; }
  .grid { display:grid; gap:8px; }
  .nums { grid-template-columns:repeat(3,1fr); margin-top:8px; }
  .row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
  .dpad { grid-template-columns:repeat(3,1fr); margin:14px 0 4px; }
  .dpad button { height:64px; font-size:22px; }
  .dpad .ok { background:var(--red); font-weight:700; }
  .vc { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .colors { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:8px; }
  .colors button { height:36px; }
  .apps { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
  #power { background:#7a0f10; }
  .off { opacity:.4; pointer-events:none; }
  #help { font-size:13px; color:#aaa; line-height:1.4; margin-top:14px; }
</style>
</head>
<body>
<h1>Controle LG (webOS)</h1>
<div id="conn">
  <input id="ip" inputmode="decimal" placeholder="IP da TV, ex.: 192.168.0.25" autocomplete="off">
  <button id="go">Conectar</button>
</div>
<div id="status">Digite o IP da TV (Rede &gt; Conexão Wi-Fi &gt; Avançado) e toque em Conectar.</div>

<div id="pad" class="off">
  <div class="row">
    <button id="power" data-act="power">⏻</button>
    <button data-act="mute">🔇</button>
    <button data-btn="HOME">Início</button>
  </div>
  <div class="grid dpad">
    <button data-btn="MENU">Menu</button><button data-btn="UP">▲</button><button data-btn="EXIT">Sair</button>
    <button data-btn="LEFT">◀</button><button class="ok" data-btn="ENTER">OK</button><button data-btn="RIGHT">▶</button>
    <button data-btn="BACK">Voltar</button><button data-btn="DOWN">▼</button><button data-btn="INFO">Info</button>
  </div>
  <div class="vc">
    <button data-act="volUp">Vol +</button><button data-act="chUp">Canal +</button>
    <button data-act="volDown">Vol −</button><button data-act="chDown">Canal −</button>
  </div>
  <div class="grid nums">
    <button data-btn="1">1</button><button data-btn="2">2</button><button data-btn="3">3</button>
    <button data-btn="4">4</button><button data-btn="5">5</button><button data-btn="6">6</button>
    <button data-btn="7">7</button><button data-btn="8">8</button><button data-btn="9">9</button>
    <button data-btn="LIST">Lista</button><button data-btn="0">0</button><button data-btn="AD">AD/SAP</button>
  </div>
  <div class="colors">
    <button data-btn="RED" style="background:#c62828">&nbsp;</button><button data-btn="GREEN" style="background:#2e7d32">&nbsp;</button>
    <button data-btn="YELLOW" style="background:#f9a825">&nbsp;</button><button data-btn="BLUE" style="background:#1565c0">&nbsp;</button>
  </div>
  <div class="apps">
    <button data-app="netflix">Netflix</button><button data-app="youtube.leanback.v4">YouTube</button><button data-app="amazon">Prime</button>
  </div>
</div>
<div id="help">Dica: se a TV pedir permissão, aceite na tela dela (o joystick físico embaixo da TV serve para escolher "Sim"). Para ligar a TV desligada é preciso apertar o botão físico dela.</div>

<script src="lgtv.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var statusEl = $('#status'), pad = $('#pad'), muted = false, tv = null;
  function say(t, cls) { statusEl.textContent = t; statusEl.className = cls || ''; }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }
  $('#ip').value = store('ip') || '';

  $('#go').onclick = function () {
    var ip = $('#ip').value.trim();
    if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) { say('IP inválido. Exemplo: 192.168.0.25', 'err'); return; }
    store('ip', ip);
    if (tv) tv.close();
    pad.classList.add('off');
    say('Conectando… se a TV mostrar um aviso, aceite nela.');
    tv = new LGTV({ clientKey: store('key'), onKey: function (k) { store('key', k); }, onState: function (s) { if (s === 'desconectado') { pad.classList.add('off'); } } });
    tv.connect(ip).then(function () { pad.classList.remove('off'); say('Conectado à TV ' + ip, 'ok'); tv.toast('Controle conectado'); })
      .catch(function (e) { say(e.message, 'err'); });
  };

  function guard(p) { if (p && p.catch) p.catch(function (e) { say(e.message, 'err'); }); }
  pad.addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b || !tv) return;
    if (b.dataset.btn) return guard(tv.button(b.dataset.btn));
    if (b.dataset.app) return guard(tv.launch(b.dataset.app));
    var a = b.dataset.act;
    if (a === 'volUp') guard(tv.volumeUp());
    else if (a === 'volDown') guard(tv.volumeDown());
    else if (a === 'chUp') guard(tv.channelUp());
    else if (a === 'chDown') guard(tv.channelDown());
    else if (a === 'mute') { muted = !muted; guard(tv.mute(muted)); }
    else if (a === 'power') guard(tv.powerOff());
  });
})();
</script>
</body>
</html>

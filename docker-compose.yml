version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: football_betting_postgres
    environment:
      POSTGRES_DB: football_betting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - football_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: football_betting_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - football_network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: football_betting_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/football_betting
      REDIS_URL: redis://redis:6379/0
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY}
      FOOTBALL_DATA_KEY: ${FOOTBALL_DATA_KEY}
      ODDS_API_KEY: ${ODDS_API_KEY}
      DEBUG: ${DEBUG:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - football_network
    restart: unless-stopped

  # Frontend Dashboard (Streamlit)
  frontend:
    build:
      context: ./frontend/dashboard
      dockerfile: Dockerfile
    container_name: football_betting_frontend
    environment:
      API_BASE_URL: http://backend:8000/api/v1
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./frontend/dashboard:/app
    networks:
      - football_network
    restart: unless-stopped

  # Celery Worker (for background tasks)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: football_betting_worker
    command: celery -A backend.tasks worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/football_betting
      REDIS_URL: redis://redis:6379/0
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY}
      FOOTBALL_DATA_KEY: ${FOOTBALL_DATA_KEY}
      ODDS_API_KEY: ${ODDS_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
    networks:
      - football_network
    restart: unless-stopped

  # Celery Beat (for scheduled tasks)
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: football_betting_beat
    command: celery -A backend.tasks beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/football_betting
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
    networks:
      - football_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  football_network:
    driver: bridge
name: LG Remote APK
on:
  push:
    paths: ['lg-remote/**', '.github/workflows/lg-remote.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Build
        working-directory: lg-remote
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: controle-lg-apk
          path: lg-remote/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp lg-remote/app/build/outputs/apk/debug/app-debug.apk controle-lg.apk
          gh release create "controle-lg-v${{ github.run_number }}" controle-lg.apk \
            --title "Controle LG v${{ github.run_number }}" \
            --notes "APK de teste (debug) do Controle LG. Instale no Android permitindo fontes desconhecidas." \
            --prerelease --target "${{ github.sha }}"

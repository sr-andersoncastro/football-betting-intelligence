name: Corrida Certa APK
on:
  workflow_dispatch:   # só compila quando pedido (o APK não é gerado a cada alteração)
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1', cache-disabled: true }
      - name: Testes e APK
        working-directory: corrida-certa
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: corrida-certa-apk
          path: corrida-certa/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

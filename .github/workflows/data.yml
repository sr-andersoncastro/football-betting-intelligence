name: Football data snapshots
on:
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-data-sync
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: sync
        continue-on-error: true
        run: npm run sync
      - run: node scripts/predict.mjs
      - run: npm test
      - name: Preserve capture in repository history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/openliga.json data/espn.json data/predictions.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh audited OpenLigaDB captures"
            git push
          fi

      - name: Report partial collection failure
        if: steps.sync.outcome == 'failure'
        run: exit 1
